<main style="text-align:center" class="content" (click)="showInfoPanel && toggleInfo()">
    <h2 class="texto">{{ title }}!</h2>

    <app-pagination></app-pagination>

    <section>
        <h2>{{ data().question }}</h2>
        @if (data().img) {
            <img class="img-qa" [src]="data().img" alt="Pregunta">
        }
    </section>        

    @if (!data().success) {
        <section class="responder">
            <input #answer
                (keyup.enter)="check(answer.value)" [(ngModel)]="inputValue">

            <button type="button" (click)="check(answer.value)">Responder</button>
        </section>
    }

    <app-info-panel [InfoPanel]="showInfoPanel"></app-info-panel>

</main>

<div class="premio" (click)="toggleInfo()">{{ premioAcumulado() }} €</div>
