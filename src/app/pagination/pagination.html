<section>
  @for (dato of datos(); track dato.id) {
    <span class="circulos"
      (click)="changeQuestion(dato.id)"
      [class.goldem]="dato.success && dato.goldem"
      [class.success]="dato.success && !dato.goldem"
      [class.selected]="indice() === dato.id">
      @if (dato.success && dato.goldemInicial) {
        {{ dato.goldemInicial }}
      } @else {
        {{ dato.inicial }}
      }
    </span>
  }
</section>
